<script>
(function() {
  // ---- Helpers ----
  function fmtBytes(bytes) {
    if (bytes == null || bytes === 0) return '0 B';
    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
    var i = 0; var v = bytes;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return v.toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
  }

  function fmtPct(progress) {
    return (progress * 100).toFixed(1) + '%';
  }

  function getFileType(filename) {
    var parts = filename.split('.');
    var ext = parts.length > 1 ? parts[parts.length - 1].toLowerCase() : '';
    var video = ['mp4', 'mkv', 'avi', 'mov', 'wmv', 'flv', 'webm', 'm4v'];
    var music = ['mp3', 'flac', 'wav', 'aac', 'ogg', 'wma', 'm4a', 'opus'];
    if (video.indexOf(ext) !== -1) return 'video';
    if (music.indexOf(ext) !== -1) return 'music';
    return 'document';
  }

  function escapeHtml(text) {
    var d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  function iconForType(type) {
    if (type === 'video') return 'movie';
    if (type === 'music') return 'music_note';
    return 'description';
  }

  function buildTaskCard(task) {
    var id = 'task-' + task.task_id;
    var type = getFileType(task.file_name);
    var pct = task.progress || 0;
    var isDownloading = task.status === 'DOWNLOADING';
    var isPending = task.status === 'PENDING';
    var isCompleted = task.status === 'COMPLETED';
    var isFailed = task.status === 'FAILED';
    var downloaded = fmtBytes(task.downloaded_bytes);
    var total = fmtBytes(task.file_size_bytes);

    var dimmed = isPending ? ' opacity-80 grayscale-[0.5]' : '';
    var hover = isPending ? ' hover:grayscale-0 hover:opacity-100' : '';

    var iconBoxBg, iconColor, iconStyle;
    if (isCompleted) {
      iconBoxBg = 'bg-tertiary/10 border-tertiary/20';
      iconColor = 'text-tertiary';
      iconStyle = "font-variation-settings: 'FILL' 1;";
    } else if (isDownloading) {
      iconBoxBg = 'bg-secondary/10 border-secondary/20';
      iconColor = 'text-secondary';
      iconStyle = "font-variation-settings: 'FILL' 1;";
    } else {
      iconBoxBg = 'bg-surface-container-high border-outline-variant';
      iconColor = 'text-on-surface-variant';
      iconStyle = '';
    }

    var badgeClass, badgeText;
    if (isDownloading) {
      badgeClass = 'bg-primary/10 text-primary border-primary/20';
      badgeText = 'DOWNLOADING';
    } else if (isPending) {
      badgeClass = 'bg-surface-container-highest text-on-surface-variant border-outline-variant';
      badgeText = 'PENDING';
    } else if (isCompleted) {
      badgeClass = 'bg-tertiary/10 text-tertiary border-tertiary/20';
      badgeText = 'COMPLETED';
    } else if (isFailed) {
      badgeClass = 'bg-error-container/10 text-error border-error/20';
      badgeText = 'FAILED';
    } else {
      badgeClass = 'bg-surface-container-highest text-on-surface-variant border-outline-variant';
      badgeText = task.status;
    }

    var bytesInfo = '';
    if (isDownloading && task.file_size_bytes) {
      bytesInfo = downloaded + ' / ' + total;
    } else if (isCompleted && task.file_size_bytes) {
      bytesInfo = total;
    } else if (isPending && task.file_size_bytes) {
      bytesInfo = '0 B / ' + total;
    } else if (task.file_size_bytes) {
      bytesInfo = total;
    }

    var statusLine = '';
    if (isDownloading) {
      statusLine = '<span class="w-1 h-1 bg-outline-variant rounded-full"></span><span class="text-label-caps font-label-caps text-secondary">' + downloaded + '/s</span>';
    } else if (isPending) {
      statusLine = '<span class="w-1 h-1 bg-outline-variant rounded-full"></span><span class="text-label-caps font-label-caps text-on-surface-variant">Waiting...</span>';
    } else if (isCompleted) {
      statusLine = '<span class="w-1 h-1 bg-outline-variant rounded-full"></span><span class="text-label-caps font-label-caps text-primary flex items-center gap-1"><span class="material-symbols-outlined text-sm">check</span> Downloaded</span>';
    }

    var progressBar = '';
    if (isDownloading) {
      progressBar = '<div class="w-full h-2 bg-surface-container-highest rounded-full overflow-hidden relative"><div class="h-full bg-primary relative overflow-hidden transition-all duration-500" style="width: ' + (pct * 100) + '%;"><div class="absolute inset-0 progress-shimmer"></div></div></div>';
    } else if (isCompleted) {
      progressBar = '<div class="w-full h-2 bg-primary/20 rounded-full overflow-hidden"><div class="h-full bg-primary" style="width: 100%;"></div></div>';
    } else if (isFailed) {
      progressBar = '<div class="w-full h-2 bg-error/20 rounded-full overflow-hidden"><div class="h-full bg-error" style="width: ' + (pct * 100) + '%;"></div></div>';
    } else {
      progressBar = '<div class="w-full h-2 bg-surface-container-highest rounded-full overflow-hidden"><div class="h-full bg-outline-variant" style="width: 0%;"></div></div>';
    }

    var actionsHtml = '';
    if (isCompleted) {
      actionsHtml = '<div class="flex gap-2"><button class="p-2 bg-surface-container-high text-on-surface hover:text-primary transition-colors rounded-lg"><span class="material-symbols-outlined">play_arrow</span></button><button class="p-2 bg-surface-container-high text-on-surface hover:text-primary transition-colors rounded-lg"><span class="material-symbols-outlined">folder_open</span></button></div>';
    }

    var fileNameColor = isCompleted ? '' : (isDownloading ? ' group-hover:text-primary transition-colors' : '');

    return '<div id="' + id + '" class="group relative bg-surface-container-low border border-outline-variant rounded-xl p-4 md:p-6 transition-all hover:shadow-[0_8px_30px_rgb(0,0,0,0.4)] hover:border-primary/30' + dimmed + hover + '">' +
        '<div class="flex flex-col md:flex-row items-start justify-between gap-3 mb-4">' +
          '<div class="flex items-center gap-3 md:gap-4 w-full md:w-auto min-w-0">' +
            '<div class="w-10 h-10 md:w-12 md:h-12 rounded-xl shrink-0 ' + iconBoxBg + ' flex items-center justify-center border">' +
              '<span class="material-symbols-outlined ' + iconColor + ' text-xl md:text-2xl" style="' + iconStyle + '">' + iconForType(type) + '</span>' +
            '</div>' +
            '<div class="min-w-0 flex-1">' +
              '<h4 class="text-sm md:text-headline-sm font-headline-sm text-on-surface truncate' + fileNameColor + '">' + escapeHtml(task.file_name) + '</h4>' +
              '<div class="flex items-center gap-2 md:gap-3 mt-1 flex-wrap">' +
                '<span class="text-[10px] md:text-label-caps font-label-caps text-on-surface-variant">' + bytesInfo + '</span>' +
                statusLine +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="flex flex-row md:flex-col items-center md:items-end justify-between w-full md:w-auto gap-2">' +
            '<span class="px-2 py-0.5 md:px-3 md:py-1 text-[10px] md:text-label-caps ' + badgeClass + ' rounded-full font-label-caps">' + badgeText + '</span>' +
            (isDownloading ? '<span class="text-sm md:text-headline-sm font-headline-sm text-on-surface">' + fmtPct(pct) + '</span>' : '') +
            actionsHtml +
          '</div>' +
        '</div>' +
        progressBar +
      '</div>';
  }

  var taskList = document.getElementById('task-list');
  var connectionBadge = document.getElementById('connection-badge');
  var TERMINAL_STATUSES = ['COMPLETED', 'FAILED', 'CANCELLED'];
  var POLL_INTERVAL = 15000;

  // ---- DOM Render ----

  function renderTask(task) {
    var html = buildTaskCard(task);
    var existing = document.getElementById('task-' + task.task_id);
    if (existing) {
      existing.outerHTML = html;
    } else {
      var empty = taskList.querySelector('[data-empty]');
      if (empty) empty.remove();
      taskList.insertAdjacentHTML('beforeend', html);
    }
  }

  function renderTasks(tasks) {
    taskList.innerHTML = '';
    if (!tasks || tasks.length === 0) {
      renderEmpty();
      return;
    }
    for (var i = 0; i < tasks.length; i++) {
      taskList.insertAdjacentHTML('beforeend', buildTaskCard(tasks[i]));
    }
  }

  function renderEmpty() {
    taskList.innerHTML =
      '<div data-empty class="flex flex-col items-center justify-center py-20 text-on-surface-variant">' +
        '<span class="material-symbols-outlined text-6xl mb-4 opacity-30">download</span>' +
        '<p class="text-headline-sm font-headline-sm">No active downloads</p>' +
        '<p class="text-body-sm mt-1">Send a file to the bot to get started.</p>' +
      '</div>';
  }

  function renderError(msg) {
    taskList.innerHTML =
      '<div data-empty class="flex flex-col items-center justify-center py-20 text-on-surface-variant">' +
        '<span class="material-symbols-outlined text-6xl mb-4 opacity-30 text-error">error_outline</span>' +
        '<p class="text-headline-sm font-headline-sm text-error">Could not load tasks</p>' +
        '<p class="text-body-sm mt-1">' + escapeHtml(msg || 'Check connection and try again.') + '</p>' +
      '</div>';
  }

  function setConnected(ok) {
    var dot = ok
      ? '<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>'
      : '<span class="relative inline-flex rounded-full h-2 w-2 bg-on-surface-variant"></span>';
    var text = ok ? 'Connected' : 'Disconnected';
    var textClass = ok ? 'text-primary' : 'text-on-surface-variant';

    connectionBadge.innerHTML =
      '<span class="relative flex h-2 w-2">' + dot + '</span>' +
      '<span class="text-[10px] font-bold ' + textClass + ' tracking-widest uppercase">' + text + '</span>';

    var dotEl = document.getElementById('connection-dot');
    if (dotEl) dotEl.innerHTML = dot;
  }

  // ---- API ----
  function fetchActiveTasks() {
    fetch('/tasks/active')
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(tasks) {
        renderTasks(tasks);
      })
      .catch(function(err) {
        renderError(err.message);
      });
  }

  // ---- WebSocket ----
  var ws = null;
  var reconnectTimer = null;
  var pollTimer = null;

  function connectWS() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

    var protocol = location.protocol === 'https:' ? 'wss' : 'ws';
    var url = protocol + '://' + location.host + '/ws';
    ws = new WebSocket(url);

    ws.onopen = function() {
      setConnected(true);
      fetchActiveTasks();
    };

    ws.onmessage = function(event) {
      try {
        var data = JSON.parse(event.data);
        if (TERMINAL_STATUSES.indexOf(data.status) !== -1) {
          fetchActiveTasks();
        } else {
          renderTask(data);
        }
      } catch (e) {
        console.warn('WS message error:', e);
      }
    };

    ws.onclose = function() {
      setConnected(false);
      startPolling();
      scheduleReconnect();
    };

    ws.onerror = function() {
      setConnected(false);
      startPolling();
    };
  }

  function scheduleReconnect() {
    if (reconnectTimer) clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(function() { connectWS(); }, 3000);
  }

  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function() {
      fetchActiveTasks();
    }, POLL_INTERVAL);
  }

  // ---- Sidebar Tab Switching ----
  document.querySelectorAll('aside nav a').forEach(function(link) {
    link.addEventListener('click', function(e) {
      document.querySelectorAll('aside nav a').forEach(function(l) {
        l.classList.remove('bg-secondary-container', 'dark:bg-on-secondary-fixed-variant', 'text-on-secondary-container', 'dark:text-secondary-fixed');
        l.classList.add('text-on-surface-variant');
      });
      this.classList.add('bg-secondary-container', 'dark:bg-on-secondary-fixed-variant', 'text-on-secondary-container', 'dark:text-secondary-fixed');
      this.classList.remove('text-on-surface-variant');
    });
  });

  // ---- Sidebar Toggle (Mobile) ----
  var menuToggle = document.getElementById('menu-toggle');
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebar-overlay');

  function openSidebar() {
    sidebar.classList.remove('-translate-x-full');
    sidebar.classList.add('translate-x-0');
    overlay.classList.remove('hidden');
    document.body.classList.add('overflow-hidden');
  }

  function closeSidebar() {
    sidebar.classList.add('-translate-x-full');
    sidebar.classList.remove('translate-x-0');
    overlay.classList.add('hidden');
    document.body.classList.remove('overflow-hidden');
  }

  if (menuToggle) {
    menuToggle.addEventListener('click', function() {
      if (sidebar.classList.contains('-translate-x-full')) {
        openSidebar();
      } else {
        closeSidebar();
      }
    });
  }

  if (overlay) {
    overlay.addEventListener('click', closeSidebar);
  }

  // Close sidebar on nav link click (mobile)
  document.querySelectorAll('aside nav a').forEach(function(link) {
    link.addEventListener('click', function() {
      closeSidebar();
    });
  });

  // ---- Init ----
  fetchActiveTasks();
  connectWS();
})();
</script>
</body></html>
